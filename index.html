<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CKA Grind Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#150a02;--panel:#22110a;--panel2:#2b150b;--line:#6b3a14;--e1:#ff3d00;--e2:#ff8a00;--e3:#ffc24d;--w:#fff;--mut:#cfa27a;--dim:#8a6a4f;--ok:#7dd87d;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--w);font-family:'Archivo',system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:800px;margin:0 auto;padding:16px 13px 90px}
h1{font-family:'Anton',sans-serif;font-size:clamp(34px,9vw,52px);text-transform:uppercase;line-height:1}
h1 .fl{background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;margin-top:5px}
.glow{border:1px solid rgba(255,138,0,.55);box-shadow:0 0 8px rgba(255,90,0,.4),inset 0 0 8px rgba(255,90,0,.1);border-radius:14px;background:var(--panel)}
.tabs{display:flex;gap:7px;margin:16px 0 12px}
.tab{flex:1;text-align:center;padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-family:'Anton',sans-serif;font-size:16.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.tab.on{color:#1a0c02;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3));border-color:transparent;box-shadow:0 0 8px rgba(255,90,0,.55)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--e3);outline-offset:2px}
.verdict{padding:14px;margin-bottom:12px;text-align:center}
.verdict .big{font-family:'Anton',sans-serif;font-size:27px;letter-spacing:.03em}
.verdict .big.ready{background:linear-gradient(90deg,var(--e2),var(--e3));-webkit-background-clip:text;background-clip:text;color:transparent}
.verdict .note{font-size:14.5px;color:var(--mut);margin-top:4px}
.mod{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.mod.done{border-color:rgba(255,194,77,.7);box-shadow:0 0 8px rgba(255,140,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mname{font-weight:700;font-size:18px}
.mmeta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);white-space:nowrap}
.mscore{font-family:'JetBrains Mono',monospace;font-size:13.5px;margin-top:5px;color:var(--mut)}
.mscore b{color:var(--e3)}
.topics{font-size:14px;color:var(--mut);margin-top:6px}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:none;border-radius:11px;padding:12px;font-family:'Anton',sans-serif;font-size:16.5px;letter-spacing:.05em;text-transform:uppercase;color:#1a0c02;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3));cursor:pointer}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.qcard{padding:16px}
.qnum{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.qtext{font-weight:700;font-size:19px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--w);padding:12px;margin-bottom:8px;font-size:17px;font-family:'Archivo',sans-serif;cursor:pointer}
.opt.right{border-color:var(--ok);box-shadow:0 0 8px rgba(125,216,125,.4)}
.opt.wrong{border-color:var(--bad);box-shadow:0 0 8px rgba(255,107,107,.4)}
.expl{font-size:15px;color:var(--mut);margin:4px 0 10px;font-style:italic}
.timer{font-family:'JetBrains Mono',monospace;font-size:15.5px;color:var(--e3)}
.card{padding:18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.card .lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.card .txt{font-size:19px;font-weight:700}
.card .txt.ans{font-family:'JetBrains Mono',monospace;font-size:16.5px;font-weight:400;color:var(--e3);word-break:break-word}
.gotrow{display:flex;gap:8px;margin-top:10px}
.gotrow .btn.miss{background:none;color:var(--bad);border:1px solid var(--bad)}
.small{font-size:14px;color:var(--dim);margin-top:8px;font-family:'JetBrains Mono',monospace}
.setupcard{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.setupcard b{color:var(--e3)}
.setupcard .cmd{font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--panel2);border-radius:8px;padding:8px;margin-top:6px;color:var(--mut);word-break:break-all}
.setupcard input{width:100%;margin-top:8px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--w);font-family:'JetBrains Mono',monospace;font-size:14px}
a{color:var(--e3)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid rgba(255,138,0,.7);box-shadow:0 0 8px rgba(255,90,0,.6);border-radius:999px;padding:10px 20px;font-weight:700;font-size:15.5px;transition:transform .25s ease;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#loading{padding:60px 0;text-align:center;color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:13.5px;text-transform:uppercase;letter-spacing:.16em}
.bar{height:6px;border-radius:3px;background:#3a1d0c;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3))}
details.learn{margin:11px 0 4px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);overflow:hidden}
details.learn>summary{cursor:pointer;list-style:none;padding:10px 13px;font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--e3)}
details.learn>summary::-webkit-details-marker{display:none}
details.learn>summary::before{content:"▸ "}
details.learn[open]>summary::before{content:"▾ "}
details.learn .lbody{padding:2px 14px 15px;font-size:16.5px;line-height:1.55}
.lbody h5{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--e2);margin:15px 0 6px}
.lbody p{margin:8px 0}
.lbody ul,.lbody ol{margin:8px 0 8px 22px}
.lbody li{margin:5px 0}
.lbody code{font-family:'JetBrains Mono',monospace;font-size:14px;background:#170b04;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--e3);word-break:break-word}
.lbody b{color:var(--e3)}
details.sc{margin:9px 0;border:1px dashed var(--line);border-radius:9px;background:var(--panel)}
details.sc>summary{cursor:pointer;list-style:none;padding:9px 12px;color:var(--mut);font-size:15.5px}
details.sc>summary::-webkit-details-marker{display:none}
details.sc .scans{padding:0 12px 11px;color:var(--ok);font-size:15.5px}
.lbody pre{font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.5;background:#170b04;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;color:var(--e3);overflow-x:auto;white-space:pre}
.lbody .stubline{color:var(--mut);font-size:15.5px;margin:2px 0 6px}
</style>
</head>

</div>

m1:`<details class="learn"><summary>Learn · Day 1 · How Kubernetes actually works</summary><div class="lbody">
<h5>Day 1 · How Kubernetes actually works</h5>
<p>Kubernetes is a declarative loop machine. You write <b>desired state</b> into a database, and independent controllers work forever to make reality match it. You never tell Kubernetes to do something, you tell it what should be true. Every component below is a specialist inside that loop.</p>
<h5>The six components</h5>
<ul>
<li><b>kube-apiserver</b> · the front door. Everything talks to it, nothing talks around it. The only component that touches etcd.</li>
<li><b>etcd</b> · the database. The cluster's entire truth as key-values.</li>
<li><b>kube-scheduler</b> · watches for pods with no node assigned, picks a node. That is all it does. It never runs anything.</li>
<li><b>kube-controller-manager</b> · runs the reconcile loops: Deployment controller, ReplicaSet controller, Node controller.</li>
<li><b>kubelet</b> · the agent on every node. Sees "a pod is assigned to me," tells containerd to start containers, reports status back.</li>
<li><b>kube-proxy</b> · programs each node's networking rules so Services actually route.</li>
</ul>
<h5>What happens on kubectl apply</h5>
<ol>
<li>kubectl sends to the API server (authn, authz, admission), which writes to etcd. Nothing has happened yet.</li>
<li>Deployment controller notices, creates a ReplicaSet.</li>
<li>ReplicaSet controller creates Pod objects. Still just database rows.</li>
<li>Scheduler sees unassigned pods, stamps a node name on each.</li>
<li>kubelet on that node sees its assignment, pulls the image, starts containers.</li>
<li>kubelet reports status back up.</li>
</ol>
<h5>Why this is worth 30% of the exam</h5>
<p>Every classic failure maps to a stage, so diagnosis becomes "which stage died":</p>
<ul>
<li>Pod stuck <b>Pending</b> · never left stage 4 · scheduler: resources, taints, no schedulable nodes.</li>
<li><b>ImagePullBackOff</b> · stage 5 · kubelet, registry, or image name.</li>
<li>Deployment exists, zero pods · stages 2 to 3 · controller-manager.</li>
<li><code>kubectl</code> hangs or refuses connection · stage 1 · API server.</li>
</ul>
<h5>Static pods, the exam's favorite trick</h5>
<p>On kubeadm clusters the control plane itself runs as <b>static pods</b>: plain YAML files in <code>/etc/kubernetes/manifests</code> that the node's kubelet runs directly, no scheduler involved. Delete one with kubectl and the kubelet instantly rebuilds it from the file. To truly stop it, move its manifest out of that folder. Break the apiserver and kubectl goes dead, so you repair it by editing the file on disk.</p>
<h5>Lab · killercoda.com playground</h5>
<ol>
<li><code>kubectl get nodes -o wide</code> · see the machines.</li>
<li><code>kubectl get pods -n kube-system</code> · spot the components running as pods.</li>
<li><code>ls /etc/kubernetes/manifests</code> · the control plane as text on disk.</li>
<li><code>kubectl describe node</code> · capacity, taints, conditions. Just read it.</li>
</ol>
<h5>Self-check · answer out loud before revealing</h5>
<details class="sc"><summary>1 · Pod stuck Pending. Who did their job, who didn't?</summary><div class="scans">API server accepted it, controllers created the Pod object. The scheduler hasn't assigned a node, so no kubelet ever hears about it. Check resources, taints, node availability.</div></details>
<details class="sc"><summary>2 · You delete a control plane pod and it comes right back. Why, and how do you stop it for real?</summary><div class="scans">It's a static pod. The kubelet runs it straight from its manifest in /etc/kubernetes/manifests and recreates it while the file exists. Move the file out of the directory to stop it.</div></details>
<details class="sc"><summary>3 · The only component allowed to talk to etcd?</summary><div class="scans">kube-apiserver. Everything else goes through it.</div></details>
</div></details>
<details class="learn"><summary>Learn · Day 2 loaded · kubectl speed and YAML with $do</summary><div class="lbody">
<h5>Day 2 · kubectl speed and YAML generation</h5>
<p>The exam is two hours for roughly 17 tasks. Nobody fails it on knowledge, people fail it on typing. Today is about never writing YAML from a blank file again: you make kubectl generate a skeleton, edit the two lines that matter, apply. Every task becomes the same three moves.</p>
<h5>First 20 seconds on every host</h5>
<p>Exam hosts already have <code>alias k=kubectl</code> with bash completion. What they do not have is your shortcuts, and every <code>ssh</code> lands you in a fresh shell, so this is muscle memory, not setup:</p>
<pre>export do='--dry-run=client -o yaml'
export now='--force --grace-period=0'</pre>
<p><code>$do</code> means "show me the YAML you would send, send nothing." <code>$now</code> kills a pod without the 30 second grace wait. Re-export after each ssh, no exceptions.</p>
<h5>The three-move loop</h5>
<pre>k run web --image=nginx --port=80 $do > web.yaml
vim web.yaml        # add the field the task asked for
k apply -f web.yaml</pre>
<p>If the object already exists and the field is immutable (most pod spec fields are), <code>k apply</code> refuses. Then it is <code>k replace --force -f web.yaml</code>, which deletes and recreates in one go. For deployments <code>k apply</code> or <code>k edit</code> is fine because the template rolls out.</p>
<h5>Generators worth having in your fingers</h5>
<ul>
<li><b>Pod</b> · <code>k run web --image=nginx --port=80 --labels=app=web --env=MODE=prod $do</code></li>
<li><b>Pod with a command</b> · <code>k run busy --image=busybox $do -- sh -c 'sleep 3600'</code> · everything after <code>--</code> becomes the container command.</li>
<li><b>Throwaway debug pod</b> · <code>k run tmp --image=busybox -it --rm --restart=Never -- wget -qO- http://web</code> · gone when you exit.</li>
<li><b>Deployment</b> · <code>k create deploy web --image=nginx --replicas=3 --port=80 $do</code></li>
<li><b>Service</b> · <code>k expose deploy web --port=80 --target-port=8080 --name=web-svc $do</code> · expose copies the selector from the target for you. <code>k create svc clusterip web --tcp=80:8080</code> exists but guesses a selector of app=web, so expose is safer.</li>
<li><b>Job / CronJob</b> · <code>k create job once --image=busybox $do -- date</code> · <code>k create cronjob tick --image=busybox --schedule='*/5 * * * *' $do -- date</code></li>
<li><b>Config</b> · <code>k create cm app --from-literal=MODE=prod --from-file=app.conf $do</code> · same shape for <code>k create secret generic</code></li>
<li><b>Namespace, SA, RBAC</b> · <code>k create ns dev</code>, <code>k create sa deploy-bot</code>, <code>k create role</code> / <code>rolebinding</code> (Day 9 goes deep on these).</li>
</ul>
<h5>Change things without opening an editor</h5>
<ul>
<li><code>k set image deploy/web nginx=nginx:1.27</code> · container name equals image name, check with <code>k get deploy web -o jsonpath='{.spec.template.spec.containers[*].name}'</code></li>
<li><code>k set resources deploy web --requests=cpu=100m,memory=128Mi --limits=cpu=500m,memory=256Mi</code></li>
<li><code>k set env deploy/web MODE=prod</code></li>
<li><code>k scale deploy web --replicas=5</code> · <code>k rollout status deploy/web</code> · <code>k rollout undo deploy/web</code></li>
<li><code>k label pod web tier=front</code> · <code>k annotate</code> works the same · <code>k label pod web tier-</code> removes.</li>
</ul>
<h5>What the generators cannot do</h5>
<p>Probes, volumes, nodeSelector, tolerations, affinity, securityContext, initContainers, resource fields on a pod. For these the skeleton gets you the frame and you type the block. Two tools replace memorising the shape:</p>
<pre>k explain pod.spec.containers.livenessProbe
k explain pod.spec.tolerations --recursive
k explain deploy.spec.strategy</pre>
<p><code>explain</code> is offline, faster than the docs tab, and prints exact field names and types. The docs are for copying a whole block (a PV, a NetworkPolicy); explain is for "was it <code>httpGet</code> or <code>httpget</code>."</p>
<h5>Reading fast</h5>
<ul>
<li><code>k get po -o wide</code> · node and IP in one line. <code>-A</code> for all namespaces. <code>--show-labels</code>, <code>-l app=web</code>.</li>
<li><code>k get po --sort-by=.metadata.creationTimestamp</code> · newest at the bottom, handy in troubleshooting.</li>
<li><code>k get po -o name</code> and <code>--no-headers</code> · pipe-friendly. <code>k get po -o name | xargs k delete $now</code> clears a namespace.</li>
<li><code>k api-resources</code> · every short name (<code>po deploy svc cm sa ns pv pvc netpol ing</code>) and whether it is namespaced. Learn it once.</li>
<li><code>k describe</code> the moment anything is not Running. The Events at the bottom are the answer nine times out of ten.</li>
</ul>
<h5>vim in two lines</h5>
<p>YAML dies on tabs. First edit on a host, set this (or drop it in <code>~/.vimrc</code>, it survives on that host):</p>
<pre>:set et ts=2 sw=2</pre>
<p>Then <code>&gt;&gt;</code> and <code>&lt;&lt;</code> indent by 2, <code>V</code> plus <code>&gt;</code> indents a block, <code>:set paste</code> before pasting from the docs so autoindent does not stair-step it.</p>
<h5>Lab · killercoda.com playground</h5>
<ol>
<li>Export <code>do</code> and <code>now</code>. Generate a pod YAML with <code>k run</code>, add a <code>livenessProbe</code> (httpGet on port 80, path /), apply, confirm with <code>k describe po</code>.</li>
<li>Create deploy <code>web</code> with 3 replicas, expose it on 80, curl it from a throwaway busybox pod by service name.</li>
<li>Change the image to <code>nginx:1.27</code> with <code>k set image</code>, watch <code>k rollout status</code>, then <code>k rollout undo</code>.</li>
<li>Try <code>k apply</code> after changing the pod's image in the file, read the error, then fix it with <code>k replace --force</code>.</li>
<li>Time yourself: pod with nodeSelector <code>disk=ssd</code> and a 512Mi memory limit, from zero to Running. Target under 90 seconds.</li>
</ol>
<h5>Self-check · answer out loud before revealing</h5>
<details class="sc"><summary>1 · You changed a pod's command in its YAML and apply says the field is immutable. Fastest fix?</summary><div class="scans">k replace --force -f pod.yaml. It deletes and recreates the pod from the file in one step.</div></details>
<details class="sc"><summary>2 · You need the exact field names for a startup probe and the docs tab is slow. What do you run?</summary><div class="scans">k explain pod.spec.containers.startupProbe (add --recursive to see the whole subtree). Offline and exact.</div></details>
<details class="sc"><summary>3 · Why use k expose instead of k create svc for an existing deployment?</summary><div class="scans">expose reads the selector off the deployment, so the Service points at the right pods. create svc guesses app=name and silently selects nothing if the labels differ.</div></details>
<details class="sc"><summary>4 · You just ssh'd to a new host and typed k run web --image=nginx $do and it created the pod. What went wrong?</summary><div class="scans">$do was empty, the export does not survive ssh. Delete the pod with $now (after re-exporting both) and re-run.</div></details>
<p class="stubline">Day 3 drops tomorrow: scheduling, requests and limits, taints, affinity, and why Pending is the most common word in Module 5.</p>
</div></details>`,

let S={tests:{},final:{best:0,attempts:0},cards:{},lastActive:"",streak:0};
let tab="course";let quiz=null;let drill=null;let timerH=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2000)}
const hasCS=typeof window!=="undefined"&&!!window.storage;
async function rawGet(){if(hasCS){try{const r=await window.storage.get(KEY);return r&&r.value?r.value:null}catch(e){return null}}
try{return localStorage.getItem(KEY)}catch(e){return null}}
async function rawSet(v){if(hasCS){try{const r=await window.storage.set(KEY,v);return !!r}catch(e){return false}}
try{localStorage.setItem(KEY,v);return true}catch(e){return false}}
const SYNC_REPO="adityareddy-dev/cka-course";
const TOKEN_KEY="cka_gh_token";
function getTok(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""}}
function setTok(v){try{if(v)localStorage.setItem(TOKEN_KEY,v);else localStorage.removeItem(TOKEN_KEY)}catch(e){}}
function saveTok(){const v=$("tok").value.trim();setTok(v);toast(v?"Token saved to this browser":"Token cleared");render()}
function mergeS(a,b){const out=JSON.parse(JSON.stringify(a));if(!b||typeof b!=="object")return out;
for(const id in (b.tests||{})){const t=out.tests[id]||{best:0,attempts:0};const r=b.tests[id]||{};t.best=Math.max(t.best,r.best||0);t.attempts=Math.max(t.attempts,r.attempts||0);out.tests[id]=t}
if(b.final){out.final.best=Math.max(out.final.best,b.final.best||0);out.final.attempts=Math.max(out.final.attempts,b.final.attempts||0)}
out.streak=Math.max(out.streak||0,b.streak||0);
if((b.lastActive||"")>(out.lastActive||""))out.lastActive=b.lastActive;
if((b.updated||0)>(out.updated||0))out.updated=b.updated;
return out}
function progressSummary(){return M.map(m=>m.name+" — best "+best(m.id)+"% ("+((S.tests[m.id]||{attempts:0}).attempts)+" attempts)").join("; ")+" · final "+S.final.best+"% ("+S.final.attempts+" attempts) · streak "+S.streak+" days · module pass bar "+PASS+"%"}
function setSyncStat(m){const el=$("syncstat");if(el)el.textContent=m}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
async function pullRemote(){try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),4000);let remote=null;const tok=getTok();
if(tok){const r=await fetch("https://api.github.com/repos/"+SYNC_REPO+"/contents/progress.json?ref=master",{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},cache:"no-store",signal:ac.signal});if(r.ok){const j=await r.json();remote=JSON.parse(b64d((j.content||"").replace(/\n/g,"")))}}
else{const r=await fetch("https://raw.githubusercontent.com/"+SYNC_REPO+"/master/progress.json?t="+Date.now(),{cache:"no-store",signal:ac.signal});if(r.ok)remote=await r.json()}
clearTimeout(t);
if(remote){const merged=mergeS(S,remote);if(JSON.stringify(merged)!==JSON.stringify(S)){S=merged;await rawSet(JSON.stringify(S))}}}catch(e){}}
let pushT=null;
function schedulePush(){if(!getTok())return;clearTimeout(pushT);pushT=setTimeout(pushRemote,2500)}
async function pushRemote(){const tok=getTok();if(!tok){toast("Save a token first");return}
const body=JSON.stringify(Object.assign({},S,{summary:progressSummary()}),null,1);
try{const api="https://api.github.com/repos/"+SYNC_REPO+"/contents/progress.json";
const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
let sha=null;const g=await fetch(api+"?ref=master",{headers:h,cache:"no-store"});
if(g.ok){const j=await g.json();sha=j.sha;try{if(b64d((j.content||"").replace(/\n/g,""))===body){setSyncStat("In sync");return}}catch(e){}}
const payload={message:"progress sync",content:b64e(body),branch:"master"};if(sha)payload.sha=sha;
const p=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify(payload)});
if(p.ok){setSyncStat("Synced "+new Date().toLocaleTimeString())}else{const j=await p.json().catch(()=>({}));let hint="";
if(p.status===403)hint=" — token can read but not write. Edit the token: Repository access = Only select repositories + cka-course, Permissions Contents = Read and write.";
else if(p.status===404)hint=" — token cannot see this repo. Edit the token: Repository access = Only select repositories + cka-course.";
else if(p.status===401)hint=" — token invalid or expired. Generate a new one and re-save it here.";
setSyncStat("Sync failed: HTTP "+p.status+(j.message?" · "+j.message:"")+hint);toast("Cloud sync failed ("+p.status+")")}}
catch(e){setSyncStat("Sync failed, offline?");toast("Cloud sync failed")}}
async function load(){const v=await rawGet();if(v){try{S=Object.assign(S,JSON.parse(v))}catch(e){}}
await pullRemote();
touchStreak();$("loading").style.display="none";$("app").style.display="block";render()}
async function save(){S.updated=Date.now();const ok=await rawSet(JSON.stringify(S));if(!ok)toast("Save failed");schedulePush()}
function touchStreak(){const today=new Date().toISOString().slice(0,10);if(S.lastActive===today)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=(S.lastActive===y)?S.streak+1:1;S.lastActive=today;save()}
function best(id){return (S.tests[id]&&S.tests[id].best)||0}
function allPassed(){return M.every(m=>best(m.id)>=PASS)}
function ready(){return allPassed()&&S.final.best>=PASS}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.t;quiz=null;drill=null;if(timerH){clearInterval(timerH);timerH=null}
document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()}))
function render(){const v=$("view");
if(quiz){renderQuiz(v);return}
if(tab==="course")renderCourse(v);
else if(tab==="drill")renderDrill(v);
else if(tab==="final")renderFinal(v);
else renderSetup(v)}
function renderCourse(v){let h="";
h+='<div class="verdict glow">'+(ready()
?'<div class="big ready">CLAUDE SAYS: BOOK IT</div><div class="note">All modules and the final at 85 or higher. Run both killer.sh sessions in exam week, then schedule.</div>'
:'<div class="big">NOT READY YET</div><div class="note">Pass every module test at '+PASS+'+ to unlock the final. Streak: '+S.streak+' day'+(S.streak===1?"":"s")+'.</div>')+'</div>';
for(const m of M){const b=best(m.id);const done=b>=PASS;
h+='<div class="mod'+(done?" done":"")+'"><div class="mhead"><div class="mname">'+m.name+'</div><div class="mmeta">'+m.days+' · '+(m.w?m.w+'% of exam':'free points')+'</div></div>';
h+='<div class="topics">'+m.topics+'</div>';
h+=(LEARN[m.id]||"");
h+='<div class="mscore">Best test: <b>'+b+'%</b>'+(done?" · PASSED":" · pass bar "+PASS+"%")+'</div><div class="bar"><div style="width:'+Math.min(100,b)+'%"></div></div>';
h+='<div class="btnrow"><button class="btn ghost" onclick="startDrill(\''+m.id+'\')">Drill</button><button class="btn" onclick="startQuiz(\''+m.id+'\')">Take test</button></div></div>'}
v.innerHTML=h}
function renderDrill(v){if(!drill){let h='<div class="small" style="margin-bottom:8px">Pick a deck. Tap card to flip. Missed cards come back.</div>';
for(const m of M){h+='<div class="mod"><div class="mname">'+m.name+'</div><div class="btnrow"><button class="btn" onclick="startDrill(\''+m.id+'\')">Drill '+m.cards.length+' cards</button></div></div>'}
v.innerHTML=h;return}
const c=drill.q[drill.i];
let h='<div class="glow card" onclick="flip()"><div class="lbl">'+(drill.show?"Answer":"Card "+(drill.i+1)+" of "+drill.q.length+" · tap to flip")+'</div><div class="txt'+(drill.show?" ans":"")+'">'+(drill.show?c[1]:c[0])+'</div></div>';
if(drill.show)h+='<div class="gotrow"><button class="btn miss" onclick="mark(false)">Missed</button><button class="btn" onclick="mark(true)">Got it</button></div>';
h+='<div class="small">'+drill.got+' got · '+drill.miss+' missed · <a href="#" onclick="drill=null;render();return false">exit deck</a></div>';
v.innerHTML=h}
function startDrill(id){const m=M.find(x=>x.id===id);drill={q:shuffle(m.cards.slice()),i:0,show:false,got:0,miss:0};tab="drill";syncTabs();render()}
function flip(){drill.show=!drill.show;render()}
function mark(ok){if(ok){drill.got++;drill.q.splice(drill.i,1)}else{drill.miss++;const c=drill.q.splice(drill.i,1)[0];drill.q.push(c)}
drill.show=false;if(drill.q.length===0){toast("Deck cleared. "+drill.got+" got, "+drill.miss+" missed");drill=null}else{drill.i=drill.i%drill.q.length}
touchStreak();render()}
function startQuiz(id){const m=M.find(x=>x.id===id);quiz={mode:"module",id:id,name:m.name,qs:shuffle(m.quiz.slice()),i:0,score:0,answered:-1,timeLeft:0};render()}
function startFinal(){if(!allPassed()){toast("Pass all module tests first");return}
let pool=[];for(const m of M){const take=Math.round(30*m.w/100);pool=pool.concat(shuffle(m.quiz.slice()).slice(0,take))}
quiz={mode:"final",id:"final",name:"Final Readiness Exam",qs:shuffle(pool).slice(0,30),i:0,score:0,answered:-1,timeLeft:30*60};
timerH=setInterval(()=>{quiz.timeLeft--;const el=$("tmr");if(el)el.textContent=fmt(quiz.timeLeft);if(quiz.timeLeft<=0)finishQuiz()},1000);render()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuiz(v){const q=quiz.qs[quiz.i];
let h='<div class="glow qcard"><div class="qnum"><span>'+quiz.name+' · Q'+(quiz.i+1)+'/'+quiz.qs.length+'</span>'+(quiz.mode==="final"?'<span class="timer" id="tmr">'+fmt(quiz.timeLeft)+'</span>':'')+'</div>';
h+='<div class="qtext">'+q[0]+'</div>';
q[1].forEach((o,idx)=>{let cls="opt";if(quiz.answered>-1){if(idx===q[2])cls+=" right";else if(idx===quiz.answered)cls+=" wrong"}
h+='<button class="'+cls+'" onclick="answer('+idx+')" '+(quiz.answered>-1?"disabled":"")+'>'+o+'</button>'});
if(quiz.answered>-1)h+='<div class="expl">'+q[3]+'</div><button class="btn" onclick="nextQ()">'+(quiz.i+1<quiz.qs.length?"Next":"Finish")+'</button>';
h+='<div class="small"><a href="#" onclick="abandonQuiz();return false">abandon test</a></div></div>';
v.innerHTML=h}
function answer(idx){if(quiz.answered>-1)return;quiz.answered=idx;if(idx===quiz.qs[quiz.i][2])quiz.score++;render()}
function nextQ(){if(quiz.i+1<quiz.qs.length){quiz.i++;quiz.answered=-1;render()}else finishQuiz()}
function abandonQuiz(){if(timerH){clearInterval(timerH);timerH=null}quiz=null;render()}
function finishQuiz(){if(timerH){clearInterval(timerH);timerH=null}
const pct=Math.round(100*quiz.score/quiz.qs.length);
if(quiz.mode==="module"){const t=S.tests[quiz.id]||{best:0,attempts:0};t.attempts++;t.best=Math.max(t.best,pct);S.tests[quiz.id]=t}
else{S.final.attempts++;S.final.best=Math.max(S.final.best,pct)}
touchStreak();save();
toast(pct>=PASS?("PASSED at "+pct+"%"):(pct+"%. Bar is "+PASS+"%. Drill and retake"));
quiz=null;tab= (S.final.best>=PASS&&allPassed())?"course":tab;syncTabs();render()}
function renderFinal(v){let h='<div class="mod"><div class="mname">Final Readiness Exam</div><div class="topics">30 questions weighted by exam domain, 30 minute timer, instant grading. This gates recall only — the real exam is about 17 hands-on tasks in 120 minutes at a 66 bar with partial credit, so pair it with killercoda and killer.sh labs. Unlocks when all module tests are passed at '+PASS+'%.</div>';
h+='<div class="mscore">Best: <b>'+S.final.best+'%</b> · attempts '+S.final.attempts+'</div><div class="bar"><div style="width:'+Math.min(100,S.final.best)+'%"></div></div>';
h+='<div class="btnrow"><button class="btn" onclick="startFinal()" '+(allPassed()?"":"disabled")+'>Start final</button></div>';
h+=allPassed()?'':'<div class="small">Locked: pass all module tests first.</div>';
h+='</div>';
h+='<div class="mod"><div class="mname">Exam week checklist</div><div class="topics">1. Buy the exam now — the purchase is what unlocks both killer.sh sessions, plus a free retake and a 12 month window. Book a date 1 to 2 weeks out as your forcing function. 2. Pass this final at 85 or higher. 3. killer.sh session one, review every miss. 4. killer.sh session two — killer.sh runs harder than the real exam, so finishing most tasks and understanding every miss beats chasing 90. Real bar is 66 with partial credit, we train at 85.</div></div>';
v.innerHTML=h}
function renderSetup(v){v.innerHTML=
'<div class="setupcard"><b>Phone (anywhere)</b><div class="topics">This app for drills and tests. killercoda.com free scenarios run in the mobile browser for quick labs.</div></div>'+
'<div class="setupcard"><b>Work laptop</b><div class="topics">claude.ai is blocked there, so open your hosted copy of this app (github.io or workers.dev) in the browser. Never install anything on corporate hardware. If the proxy blocks the hosted page too, Claude Code in the terminal is your drill partner, ask it to quiz you on the current module.</div></div>'+
'<div class="setupcard"><b>Personal Windows (weekend deep labs)</b><div class="topics">Install once, then you have a real cluster:</div><div class="cmd">winget install Kubernetes.kubectl<br>winget install Docker.DockerDesktop<br>go: kind create cluster --name cka</div><div class="topics" style="margin-top:6px">Week 2 onward, add a two node kubeadm practice cluster in VMs for install, upgrade, and etcd labs. I will walk you through it on day 7.</div></div>'+
'<div class="setupcard"><b>Exam environment</b><div class="topics">PSI remote XFCE desktop — your screen is a window into their Linux machine. Each task tells you which host to ssh into; kubectl there already points at the right cluster. Docs allowed in Firefox inside the desktop: kubernetes.io docs and blog, helm.sh docs, gateway-api.sigs.k8s.io. Run the PSI compatibility check days before, have government photo ID and a cleared room, check-in opens 30 minutes early.</div></div>'+
'<div class="setupcard"><b>Links</b><div class="topics"><a href="https://killercoda.com/playgrounds/scenario/kubernetes" target="_blank" rel="noopener">killercoda Kubernetes playground</a> · <a href="https://github.com/cncf/curriculum" target="_blank" rel="noopener">official CKA curriculum</a> · killer.sh sessions come with your exam purchase, save them for exam week.</div></div>'+
'<div class="setupcard"><b>Cloud sync</b><div class="topics">Paste a fine-grained GitHub token (this repo only, Contents read and write) and every score auto-commits to progress.json in the repo. All devices with the token stay in sync, and your project chat reads progress from the raw URL at any time. The token never leaves this browser.</div><input id="tok" type="password" placeholder="github_pat_..."><div class="btnrow"><button class="btn ghost" onclick="saveTok()">Save token</button><button class="btn ghost" onclick="pushRemote()">Sync now</button></div><div class="small" id="syncstat">'+(getTok()?"Token saved on this device":"No token here — progress still downloads on load, but scores from this device do not upload")+'</div></div>'+
'<div class="setupcard"><b>Sync fallback</b><div class="topics">On a machine where you would rather not store the token, carry progress by code instead.</div><div class="btnrow"><button class="btn ghost" onclick="exportProg()">Copy progress code</button><button class="btn ghost" onclick="importProg()">Paste progress code</button></div></div>'+
'<div class="small">Mode on this machine: '+(hasCS?"Claude account storage, synced":"browser storage, local to this device")+'</div>'}
function exportProg(){try{const code=btoa(JSON.stringify(S));if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(()=>toast("Progress code copied")).catch(()=>window.prompt("Copy this code:",code))}else{window.prompt("Copy this code:",code)}}catch(e){toast("Export failed")}}
function importProg(){const code=window.prompt("Paste progress code:");if(!code)return;try{const inS=JSON.parse(atob(code.trim()));if(!inS||typeof inS!=="object")throw 0;S=mergeS(S,inS);save();render();toast("Progress imported")}catch(e){toast("Bad code")}}
function syncTabs(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===tab))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
load();
</script>
